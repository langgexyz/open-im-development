networks:
  openim:
    driver: bridge

services:
  mongodb:
    image: mongo:7.0
    container_name: openim-mongo
    ports:
      - "37017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: openIM123
      MONGO_INITDB_DATABASE: openim_v3
    command: >
      bash -c '
        docker-entrypoint.sh mongod --wiredTigerCacheSizeGB 1 --auth &
        until mongosh -u root -p openIM123 --authenticationDatabase admin --eval "db.runCommand({ping:1})" &>/dev/null; do
          sleep 1
        done
        mongosh -u root -p openIM123 --authenticationDatabase admin --eval "
          db = db.getSiblingDB(\"openim_v3\");
          if (!db.getUser(\"openIM\")) {
            db.createUser({user:\"openIM\",pwd:\"openIM123\",roles:[{role:\"readWrite\",db:\"openim_v3\"}]});
          }
        "
        tail -f /dev/null
      '
    volumes:
      - openim-mongo-data:/data/db
    restart: unless-stopped
    networks:
      - openim

  redis:
    image: redis:7.0.0
    container_name: openim-redis
    ports:
      - "16379:6379"
    command: redis-server --requirepass openIM123 --appendonly yes
    volumes:
      - openim-redis-data:/data
    restart: unless-stopped
    networks:
      - openim

  etcd:
    image: bitnamilegacy/etcd:3.5.13
    container_name: openim-etcd
    ports:
      - "12379:2379"
      - "12380:2380"
    environment:
      ETCD_NAME: s1
      ETCD_DATA_DIR: /etcd-data
      ETCD_LISTEN_CLIENT_URLS: http://0.0.0.0:2379
      ETCD_ADVERTISE_CLIENT_URLS: http://0.0.0.0:2379
      ETCD_LISTEN_PEER_URLS: http://0.0.0.0:2380
      ETCD_INITIAL_ADVERTISE_PEER_URLS: http://0.0.0.0:2380
      ETCD_INITIAL_CLUSTER: s1=http://0.0.0.0:2380
      ETCD_INITIAL_CLUSTER_TOKEN: tkn
      ETCD_INITIAL_CLUSTER_STATE: new
      ALLOW_NONE_AUTHENTICATION: "yes"
    volumes:
      - openim-etcd-data:/etcd-data
    restart: unless-stopped
    networks:
      - openim

  kafka:
    image: bitnamilegacy/kafka:3.5.1
    container_name: openim-kafka
    ports:
      - "19094:9094"
    environment:
      KAFKA_CFG_NODE_ID: 0
      KAFKA_CFG_PROCESS_ROLES: controller,broker
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 0@kafka:9093
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_NUM_PARTITIONS: 8
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_CFG_LISTENERS: "INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:9094"
      KAFKA_CFG_ADVERTISED_LISTENERS: "INTERNAL://kafka:9092,EXTERNAL://localhost:19094"
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT,INTERNAL:PLAINTEXT"
      KAFKA_CFG_INTER_BROKER_LISTENER_NAME: "INTERNAL"
    volumes:
      - openim-kafka-data:/bitnami/kafka
    restart: unless-stopped
    networks:
      - openim

  minio:
    image: minio/minio:RELEASE.2024-01-11T07-46-16Z
    container_name: openim-minio
    ports:
      - "10005:9000"
      - "19090:9090"
    environment:
      MINIO_ROOT_USER: root
      MINIO_ROOT_PASSWORD: openIM123
    command: minio server /data --console-address ':9090'
    volumes:
      - openim-minio-data:/data
    restart: unless-stopped
    networks:
      - openim

volumes:
  openim-mongo-data:
  openim-redis-data:
  openim-etcd-data:
  openim-kafka-data:
  openim-minio-data:
